async function fetchAndFillMetadata() {
  const url = document.getElementById('add-url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//.test(url)) {
    document.getElementById('fetch-status').innerHTML = '<div class="test-result error">URL must start with http:// or https://</div>';
    return;
  }

  // Duplicate check first — cheap, runs locally
  const dup = findDuplicate(url);
  if (dup) {
    const dupCategory = dup.category ? ` · in <strong>${TAB_LABELS[dup.category]}</strong>` : '';
    const sourceLabel = dup.source === 'feed' ? 'Auto-fetched' : 'Shared by ' + escapeHtml(dup.addedBy || 'someone');
    document.getElementById('fetch-status').innerHTML = `
      <div class="test-result error" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
        <div><strong>⚠ Already in your feed</strong></div>
        <div style="font-weight:500;font-size:11px;line-height:1.5;">
          "${escapeHtml(dup.title)}"<br>
          ${sourceLabel} · ${timeAgo(dup.addedAt)}${dupCategory}
        </div>
        <button class="btn btn-secondary" style="padding:5px 10px;font-size:11px;margin-top:4px;" onclick="closeModal(); openItemDetail('${dup.id}');">Open existing</button>
      </div>`;
    document.getElementById('add-form').style.display = 'none';
    document.getElementById('save-link-btn').disabled = true;
    return;
  }

  document.getElementById('fetch-status').innerHTML = '<div class="test-result loading"><span class="spinner"></span> Fetching metadata...</div>';
  document.getElementById('fetch-btn').disabled = true;

  const meta = await fetchMetadata(url);

  document.getElementById('fetch-btn').disabled = false;
  document.getElementById('fetch-status').innerHTML = meta._fetchFailed
    ? '<div class="test-result error">Couldn\'t fetch — fill in manually below.</div>'
    : '<div class="test-result success">✓ Metadata fetched</div>';

  document.getElementById('add-form').style.display = 'block';
  document.getElementById('add-title').value = meta.title || '';
  document.getElementById('add-desc').value = meta.description || '';
  document.getElementById('add-type').value = meta.contentType || 'article';
  document.getElementById('add-domain').value = meta.domain || '';
  // Pre-suggest category based on URL/domain/title (may be empty = None)
  const suggestedCat = suggestCategory(url, meta.title);
  selectCategory(suggestedCat);
  document.getElementById('save-link-btn').disabled = false;

  // Cache image for later
  window.__addImage = meta.image || '';
}

function suggestCategory(url, title) {
  const hay = (url + ' ' + (title || '')).toLowerCase();
  if (/anthropic\.com|claude\.ai|claude\b/.test(hay)) return 'claude';
  if (/gemini|deepmind|bard\b|google.*ai/.test(hay)) return 'gemini';
  if (/openai|chatgpt|gpt-?\d/.test(hay)) return 'chatgpt';
  return '';
}

function selectCategory(category) {
  document.querySelectorAll('.tab-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.tabValue === category);
  });
  window.__selectedCategory = category || null;
}

function handleTagKey(e) {
  const input = e.target;
  if (e.key === 'Enter' || e.key === ',' || e.key === ' ') {
    e.preventDefault();
    const v = input.value.trim().replace(/[,\s]+$/, '');
    if (v) addTag(v);
    input.value = '';
  } else if (e.key === 'Backspace' && !input.value && window.__addTags.length) {
    window.__addTags.pop();
    renderTags();
  }
}

function addTag(tag) {
  const t = tag.trim().toLowerCase().replace(/^#/, '');
  if (!t || window.__addTags.includes(t)) return;
  window.__addTags.push(t);
  renderTags();
}

function removeTag(tag) {
  window.__addTags = window.__addTags.filter(t => t !== tag);
  renderTags();
}

function renderTags() {
  const wrap = document.getElementById('tag-wrap');
  if (!wrap) return;
  const input = wrap.querySelector('input');
  // Remove existing pills
  wrap.querySelectorAll('.tag-pill').forEach(p => p.remove());
  // Add pills
  window.__addTags.forEach(t => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `#${escapeHtml(t)} <button onclick="removeTag('${escapeAttr(t)}')">×</button>`;
    wrap.insertBefore(pill, input);
  });
  input.focus();
}

async function saveLinkFromModal() {
  const url = document.getElementById('add-url').value.trim();
  const title = document.getElementById('add-title').value.trim();
  const description = document.getElementById('add-desc').value.trim();
  const contentType = document.getElementById('add-type').value;
  const category = window.__selectedCategory || null;
  const tags = window.__addTags || [];
  if (!url || !title) { alert('URL and title required.'); return; }

  const item = newItem({
    url,
    title,
    description,
    image: window.__addImage || '',
    domain: getDomain(url),
    contentType,
    source: 'team',
    category,
    tags
  });
  S.feed.items.unshift(item);
  logActivity('add', item, { category });
  closeModal();
  render();
  await ghSaveFeed();
}

// ─── Item detail modal ───
function openItemDetail(itemId) {
  const it = findItem(itemId);
  if (!it) return;
  // Mark as read on open
  markAsRead(itemId);

  const me = S.settings.userName || 'unknown';
  const reactionsHtml = REACTIONS.map(r => {
    const list = it.reactions?.[r.key] || [];
    const isMine = list.includes(me);
    const reactorsText = list.length > 0 ? list.join(', ') : '';
    return `
      <button class="detail-reaction-btn ${isMine ? 'active' : ''}" onclick="toggleReaction('${it.id}','${r.key}'); openItemDetail('${it.id}');" title="${escapeAttr(reactorsText)}">
        <span>${r.emoji}</span>
        <span>${r.label}</span>
        ${list.length > 0 ? `<span class="detail-reaction-count">${list.length}</span>` : ''}
      </button>`;
  }).join('');

  const tagsHtml = (it.tags || []).map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');

  const html = `
    <div class="modal-box modal-wide">
      <div class="modal-body" style="padding: 22px 26px;">
        ${it.image
          ? `<div class="detail-image"><img src="${escapeAttr(it.image)}" alt=""></div>`
          : ''}
        <div class="detail-title">${escapeHtml(it.title)}</div>
        <div class="detail-source-row">
          ${it.domain ? `<span class="item-source-badge">${faviconImg(it.domain)} ${escapeHtml(it.domain)}</span>` : ''}
          ${['claude','gemini','chatgpt','other'].includes(it.category) ? `<span class="item-tab-badge tab-${it.category}">${TAB_LABELS[it.category]}</span>` : ''}
          <a href="${escapeAttr(it.url)}" target="_blank" rel="noopener" class="detail-source-link">Open original ↗</a>
        </div>
        ${it.description ? `<div class="detail-desc">${escapeHtml(it.description)}</div>` : ''}
        ${tagsHtml ? `<div class="item-tags" style="margin-bottom: 14px;">${tagsHtml}</div>` : ''}
        <div class="detail-meta-row">
          <div>Shared by <strong>${escapeHtml(it.addedBy || 'unknown')}</strong></div>
          <div>${timeAgo(it.addedAt)}</div>
          <div>Type: <strong>${it.contentType}</strong></div>
          <div>Source: <strong>${it.source === 'feed' ? '📡 Auto' : '👥 Team'}</strong></div>
        </div>
        <div class="detail-reactions">${reactionsHtml}</div>
        <div class="field">
          <label>Categorize as</label>
          <div class="tab-selector">
            <div class="tab-option ${!it.category?'selected':''}" onclick="setItemCategory('${it.id}', null); openItemDetail('${it.id}');">None</div>
            ${MODEL_CATEGORIES.map(c =>
              `<div class="tab-option ${it.category===c?'selected':''}" style="--cat-color:var(--${c})" onclick="setItemCategory('${it.id}', '${c}'); openItemDetail('${it.id}');"><span style="width:8px;height:8px;border-radius:50%;background:var(--${c});display:inline-block;margin-right:5px;vertical-align:middle"></span>${TAB_LABELS[c]}</div>`
            ).join('')}
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" onclick="confirmDelete('${it.id}')">Delete</button>
        <div style="flex:1"></div>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        <a class="btn btn-primary" href="${escapeAttr(it.url)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>`;
  showModal(html);
}

function confirmDelete(itemId) {
  const it = findItem(itemId);
  if (!it) return;
  if (confirm(`Delete "${it.title}"?\n\nThis will be removed for everyone.`)) {
    deleteItem(itemId);
  }
}

// ─────────────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────────────
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function getInitials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 0 || !parts[0]) return '?';
  if (parts.length === 1) return parts[0][0].toUpperCase();
  // Use first letter of first word + first letter of last word (max 2)
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function timeAgo(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}d ago`;
  const w = Math.floor(d / 7);
  if (w < 4) return `${w}w ago`;
  return new Date(iso).toLocaleDateString();
}

// ─────────────────────────────────────────────────────────────
// EVENT WIRING
// ─────────────────────────────────────────────────────────────
function wireEvents() {
  // Sidebar nav items
  document.querySelectorAll('.nav-item[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      S.ui.activeTab = btn.dataset.tab;
      S.ui.selectedItemId = null;     // clear reading pane on tab change
      S.ui.editingCommentId = null;   // exit any comment edit
      // Also sync hidden tabs-wrap for JS compat
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const hiddenTab = document.querySelector(`.tab-btn[data-tab="${btn.dataset.tab}"]`);
      if (hiddenTab) hiddenTab.classList.add('active');
      updateTopbarTitle();
      render();
    });
  });

  // Hidden tabs-wrap (kept for JS compat — also wire it)
  document.getElementById('tabs-wrap').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.ui.activeTab = btn.dataset.tab;
    S.ui.selectedItemId = null;
    S.ui.editingCommentId = null;
    updateTopbarTitle();
    render();
  });

  // Type chips
  document.getElementById('type-chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#type-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    S.ui.contentType = chip.dataset.type;
    render();
  });

  // Search
  let searchTimer;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      S.ui.searchQuery = e.target.value.trim();
      render();
    }, 200);
  });

  // Shared by
  document.getElementById('sharedby-filter').addEventListener('change', e => {
    S.ui.sharedByFilter = e.target.value;
    render();
  });

  // Tag filter
  document.getElementById('tag-filter').addEventListener('change', e => {
    S.ui.tagFilter = e.target.value;
    render();
  });

  // Show older toggle
  document.getElementById('show-older').addEventListener('click', e => {
    S.ui.showOlder = !S.ui.showOlder;
    e.target.textContent = S.ui.showOlder ? 'Showing all' : 'Last 7 days';
    e.target.classList.toggle('active', !S.ui.showOlder);
    render();
  });

  // Buttons — fab-topbar instead of fab-add
  document.getElementById('fab-topbar').addEventListener('click', openAddLink);
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('history-btn').addEventListener('click', openHistory);
  document.getElementById('sync-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.style.opacity = 0.5;
    try { await ghLoadFeed(); render(); }
    catch (e) { /* setStatus already set */ }
    btn.disabled = false;
    btn.style.opacity = 1;
  });

  // ESC closes modals
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
async function init() {
  loadSettings();
  wireEvents();

  // 1. Try to load cached feed first for instant render — same pattern as training tracker
  const cached = loadFeedCache();
  if (cached && Array.isArray(cached.items) && cached.items.length > 0) {
    S.feed = {
      version: cached.version || 1,
      items: cached.items,
      activity: cached.activity || [],
      filterConfig: cached.filterConfig || JSON.parse(JSON.stringify(DEFAULT_FILTER_CONFIG)),
      _sha: null  // we don't trust cached sha — GitHub will give us the fresh one
    };
    migrateItems();
    setStatus('saving', 'Cached · refreshing...');
    render();  // instant render from cache
  }

  // 2. Then fetch fresh data from GitHub in background
  if (settingsConfigured()) {
    try {
      await ghLoadFeed();
      render();
    } catch (e) {
      console.error('Initial load failed', e);
      // If we had no cache, show empty state. If we did, the cached version is still showing.
    }
  } else if (!cached) {
    // Demo mode — inject fake settings and a sample item so the UI is visible
    S.settings.userName = 'demo';
    S.settings.githubRepo = 'demo/repo';
    S.settings.githubToken = 'demo';
    S.feed.items = [{
      id: 'demo_1', url: 'https://anthropic.com', title: 'Anthropic releases Claude 4 with extended thinking',
      description: 'The new model significantly outperforms its predecessor on coding, math, and reasoning benchmarks — a major step forward for frontier AI.',
      image: '', domain: 'anthropic.com', contentType: 'article',
      source: 'team', category: 'claude', tags: ['release', 'research'],
      addedAt: new Date().toISOString(), addedBy: 'boris',
      readBy: [], reactions: { important: ['boris','maria'], must_read: ['ivan'], watch_later: [], tried: ['boris'] },
      _updatedAt: new Date().toISOString()
    }];
    setStatus('error', 'Setup needed');
    render();
  }

  S.initialLoadDone = true;

  // Auto-sync every 60 seconds (light refresh, no overwrite)
  // Stops after 3 consecutive failures to avoid spamming errors in unreachable environments.
  let consecutiveFailures = 0;
  const autoSync = setInterval(async () => {
    if (!settingsConfigured() || S.syncing || document.getElementById('modal-overlay').children.length > 0) return;
    try {
      await ghLoadFeed();
      render();
      consecutiveFailures = 0;
    } catch (e) {
      consecutiveFailures++;
      if (consecutiveFailures >= 3) {
        console.warn('Auto-sync stopped after 3 consecutive failures. Use the manual sync button to retry.');
        clearInterval(autoSync);
      }
    }
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
