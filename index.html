<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Radar — Team · Ipsos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Brand */
  --navy:      #192166;
  --teal:      #00C4D0;
  --teal-deep: #009EBD;
  --amber:     #d97706;
  --green:     #3d9e4a;
  --red:       #e4003a;
  /* Surfaces */
  --bg:        #f0f2f7;
  --bg2:       #f6f8fc;
  --surface:   rgba(255,255,255,0.82);
  --surface-s: #ffffff;
  --border:    rgba(25,33,102,0.11);
  --border-m:  rgba(25,33,102,0.18);
  --muted:     #7a85a8;
  --muted2:    #9aaac8;
  /* Tints */
  --navy-tint: rgba(25,33,102,0.06);
  --teal-tint: rgba(0,196,208,0.10);
  --amber-tint: rgba(217,119,6,0.10);
  --red-tint:  rgba(228,0,58,0.08);
  --green-tint: rgba(61,158,74,0.10);
  /* Radii */
  --r:    13px;
  --r-sm: 8px;
  /* Gradient */
  --grad: linear-gradient(135deg, #192166 0%, #009EBD 55%, #00C4D0 100%);
  /* AI provider brand (kept distinct for tab badges) */
  --claude: #d97706; --claude-l: #fef3c7;
  --gemini: #4285f4; --gemini-l: #dbeafe;
  --chatgpt: #10a37f; --chatgpt-l: #d1fae5;
  --other:  #7a85a8; --other-l: #e4ebf3;
  --team:   #192166; --team-l: rgba(25,33,102,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--navy); font-size: 13px;
  display: flex; height: 100vh; overflow: hidden;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(25,33,102,0.18); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(25,33,102,0.32); }
input, textarea, select, button { font-family: 'Inter', sans-serif; }

/* ── SIDEBAR ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: linear-gradient(160deg, #192166 0%, #1a3080 35%, #009EBD 80%, #00C4D0 100%);
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden; position: relative;
}
.sidebar::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 120% 45% at 50% 0%, rgba(0,196,208,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 80% 40% at 100% 100%, rgba(0,158,189,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 60% 30% at 0% 60%, rgba(25,33,102,0.35) 0%, transparent 70%);
  z-index: 0;
}
.sidebar > * { position: relative; z-index: 1; }

.sidebar-header {
  height: 52px;
  padding: 0 16px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; gap: 9px;
  flex-shrink: 0;
}
.sidebar-logo-icon { color: var(--teal); flex-shrink: 0; }
.sidebar-logo-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.2px; }
.sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,0.38); }

.sidebar-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
.sidebar-scroll::-webkit-scrollbar { width: 6px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }
.sidebar-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.20); }

.sidebar-section { padding: 12px 10px 4px; }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.28);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 7px; cursor: pointer;
  color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 500;
  transition: all .15s; position: relative; border: none; background: transparent;
  width: 100%; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
.nav-item.active { background: rgba(255,255,255,0.10); color: #fff; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--teal);
}
.nav-icon { flex-shrink: 0; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto; font-size: 10px; font-weight: 600;
  background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.55);
  border-radius: 5px; padding: 1px 6px; min-width: 20px; text-align: center;
}
.nav-item.active .nav-badge { background: rgba(0,196,208,0.2); color: var(--teal); }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.sidebar-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 6px 10px; }

.sidebar-footer {
  margin-top: auto; padding: 12px 10px;
  border-top: 1px solid rgba(255,255,255,0.07);
}
.sidebar-icon-row { display: flex; gap: 2px; padding: 0 6px 6px; }
.sidebar-icon-btn {
  background: transparent; border: none; cursor: pointer;
  color: #fff; padding: 7px; border-radius: 6px;
  transition: all .15s; display: flex; align-items: center;
  opacity: 0.85;
}
.sidebar-icon-btn:hover { opacity: 1; background: rgba(255,255,255,0.12); }
.sidebar-user-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: 7px; cursor: pointer; transition: all .15s;
}
.sidebar-user-row:hover { background: rgba(255,255,255,0.07); }
.sidebar-user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--navy); flex-shrink: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.sidebar-user-name { font-size: 12px; font-weight: 700; color: #fff; }
.sidebar-user-status { font-size: 10px; color: rgba(255,255,255,0.85); }
.sidebar-save-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  cursor: help; transition: all .2s; flex-shrink: 0;
}
.sidebar-save-dot.saving { background: var(--teal); animation: pulse 1.2s infinite; }
.sidebar-save-dot.saved  { background: #3d9e4a; }
.sidebar-save-dot.error  { background: var(--red); }

/* ── MAIN ── */
#app {
  flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 52px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0; position: relative; z-index: 100;
}
.topbar-title { font-size: 14px; font-weight: 600; color: var(--navy); }
.topbar-count { font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 5px; padding: 2px 8px; }
.save-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; cursor: help; transition: all .2s; }
.save-dot.saving { background: var(--teal); animation: pulse 1.2s infinite; box-shadow: 0 0 0 2px rgba(0,196,208,0.35); }
.save-dot.saved  { background: #5dd368; box-shadow: 0 0 0 2px rgba(93,211,104,0.35); }
.save-dot.error  { background: var(--red); box-shadow: 0 0 0 2px rgba(228,0,58,0.35); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* hide old tabs-wrap — tabs moved to sidebar */
.tabs-wrap { display: none !important; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
.icon-btn {
  background: rgba(255,255,255,0.9); color: var(--navy);
  border: 1.5px solid var(--border-m); border-radius: var(--r-sm);
  padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.icon-btn:hover { background: #fff; border-color: var(--navy); box-shadow: 0 2px 8px rgba(25,33,102,0.12); }
.icon-btn-square { padding: 7px 9px; }

/* ── FILTERBAR ── */
.filterbar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 10px 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.filter-search {
  flex: 1; min-width: 200px; max-width: 360px; position: relative;
}
.filter-search input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m);
  background: rgba(255,255,255,0.9); font-size: 13px; outline: none; color: var(--navy);
  transition: all .15s;
}
.filter-search input:focus { border-color: var(--teal-deep); background: #fff; box-shadow: 0 0 0 3px rgba(0,196,208,0.12); }
.filter-search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.filter-chips { display: flex; gap: 2px; background: var(--bg); border-radius: var(--r-sm); padding: 3px; border: 1px solid var(--border); }
.chip {
  background: transparent; color: var(--muted); border: none; border-radius: 5px;
  padding: 4px 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { color: var(--navy); background: rgba(255,255,255,0.8); }
.chip.active { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 3px rgba(25,33,102,0.06); }
.chip-count { font-size: 10px; background: var(--navy-tint); color: var(--muted); border-radius: 10px; padding: 1px 6px; font-weight: 700; margin-left: 4px; }
.chip.active .chip-count { background: var(--teal-tint); color: var(--teal-deep); }

.filter-select {
  padding: 7px 11px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m);
  background: rgba(255,255,255,0.9); font-size: 12px; color: var(--navy);
  cursor: pointer; outline: none;
}
.filter-select:hover { border-color: var(--teal-deep); }

.toggle-btn {
  background: rgba(255,255,255,0.8); border: 1.5px solid var(--border-m);
  border-radius: var(--r-sm); padding: 6px 12px; font-size: 12px; font-weight: 500;
  color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.toggle-btn:hover { color: var(--navy); border-color: var(--teal-deep); }
.toggle-btn.active {
  background: var(--teal-tint); color: var(--teal-deep); border-color: var(--teal-deep);
}

/* ── CONTENT SPLIT (list + reading pane) ── */
.content-split {
  flex: 1; display: flex; min-height: 0; overflow: hidden;
}

.items-list {
  flex: 1.25; min-width: 0;
  border-right: 1px solid var(--border);
  background: var(--bg);
  overflow-y: auto; overflow-x: hidden;
  padding: 10px 12px 80px;
  display: flex; flex-direction: column; gap: 6px;
}
.items-list::-webkit-scrollbar { width: 8px; }
.items-list::-webkit-scrollbar-thumb { background: rgba(25,33,102,0.18); border-radius: 4px; }
.items-list::-webkit-scrollbar-thumb:hover { background: rgba(25,33,102,0.32); }

.reading-pane {
  flex: 1; min-width: 0;
  background: #fff;
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
.reading-pane::-webkit-scrollbar { width: 8px; }
.reading-pane::-webkit-scrollbar-thumb { background: rgba(25,33,102,0.18); border-radius: 4px; }
.reading-pane::-webkit-scrollbar-thumb:hover { background: rgba(25,33,102,0.32); }

.empty-state {
  padding: 80px 20px; text-align: center; color: var(--muted);
}
.empty-state-icon { margin-bottom: 16px; opacity: 0.7; display: flex; align-items: center; justify-content: center; }
.empty-state-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.empty-state-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; max-width: 380px; margin-left: auto; margin-right: auto; line-height: 1.6; }

/* ── ITEM ROW (in list) ── */
.item-card {
  background: #fff;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.item-card:hover {
  border-color: var(--border-m);
  box-shadow: 0 2px 8px rgba(25,33,102,0.06);
}
.item-card.selected {
  border-color: var(--teal-deep);
  background: var(--teal-tint);
  box-shadow: 0 2px 10px rgba(0,196,208,0.18);
}
.item-card.selected::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--teal-deep); border-radius: 3px 0 0 3px; z-index: 3;
}

.item-row-main {
  display: flex; flex-direction: row;
  padding: 10px; gap: 10px; min-height: 76px;
  position: relative;
}
.item-card.unread .item-row-main::before {
  content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%; background: var(--teal-deep);
  z-index: 2;
}
.item-card.unread .item-row-main { padding-left: 18px; }

.item-image {
  width: 64px; min-width: 64px; height: 64px;
  border-radius: 6px;
  background: linear-gradient(135deg, #edf0f8, #dfe5f0);
  color: var(--muted2); overflow: hidden; position: relative;
  flex-shrink: 0;
}
.item-image img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  z-index: 1;
}
.item-image-fallback {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.55;
}
.item-image-fallback svg { width: 22px; height: 22px; }
.type-icon {
  position: absolute; bottom: 2px; right: 2px;
  background: rgba(25,33,102,0.85); color: #fff; border-radius: 50%;
  width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.type-icon svg { width: 9px; height: 9px; }

.item-body { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 3px; }
.item-row-top {
  display: flex; align-items: center; gap: 6px; justify-content: space-between;
}
.item-title {
  font-size: 13px; font-weight: 600; color: var(--navy); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  flex: 1; min-width: 0;
}
.item-card.unread .item-title { font-weight: 700; }
.item-tab-badge {
  flex-shrink: 0; border-radius: 4px;
  padding: 2px 6px; font-size: 9px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tab-claude  { background: var(--claude-l);  color: var(--claude);  border: 1px solid var(--claude); }
.tab-gemini  { background: var(--gemini-l);  color: var(--gemini);  border: 1px solid var(--gemini); }
.tab-chatgpt { background: var(--chatgpt-l); color: var(--chatgpt); border: 1px solid var(--chatgpt); }
.tab-other   { background: var(--other-l);   color: var(--other);   border: 1px solid var(--other); }
.tab-team    { background: var(--team-l);    color: var(--team);    border: 1px solid var(--team); }

.item-desc {
  font-size: 11px; color: #6b7593; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.item-foot {
  display: flex; align-items: center; gap: 8px; margin-top: 2px;
  font-size: 10px; color: var(--muted); font-weight: 500;
}
.item-foot .by { color: var(--teal-deep); font-weight: 700; }
.item-foot .item-source-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-weight: 600; color: var(--muted);
}
.item-foot .item-source-badge img { width: 11px; height: 11px; border-radius: 2px; }
.item-foot-divider { color: rgba(25,33,102,0.18); }
.item-mini-reactions { display: inline-flex; gap: 2px; margin-left: auto; }
.item-mini-reactions .mini-r {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--amber-tint); color: var(--amber);
  padding: 1px 5px; border-radius: 9px; font-size: 9px; font-weight: 700;
}
.item-mini-reactions .mini-r svg { width: 9px; height: 9px; }

.item-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-chip {
  background: var(--teal-tint); color: var(--teal-deep); border: 1px solid rgba(0,196,208,0.25);
  border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 600;
}

/* ── INLINE COMMENTS PREVIEW (under item card) ── */
.item-comments-preview {
  border-top: 1px solid var(--border);
  background: linear-gradient(to bottom, rgba(238,242,248,0.4), rgba(238,242,248,0.7));
  padding: 7px 12px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.item-card.selected .item-comments-preview {
  background: rgba(255,255,255,0.5);
}
.comment-preview-row {
  display: flex; align-items: flex-start; gap: 7px;
  font-size: 11px; line-height: 1.45;
  min-width: 0;
}
.comment-avatar-mini {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--grad); color: #fff;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.comment-preview-text {
  flex: 1; min-width: 0; color: #4b5876;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.comment-preview-text strong { color: var(--navy); font-weight: 700; }
.comment-preview-more {
  font-size: 10px; color: var(--teal-deep); font-weight: 600;
  margin-top: 2px; padding-left: 25px;
}
.comment-preview-more:hover { text-decoration: underline; }

/* ── READING PANE ── */
.reading-pane-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; color: var(--muted);
  flex-direction: column; gap: 12px;
}
.reading-pane-empty-icon { opacity: 0.35; }
.reading-pane-empty-title { font-size: 15px; font-weight: 600; color: var(--navy); }
.reading-pane-empty-sub { font-size: 12px; color: var(--muted); text-align: center; max-width: 280px; line-height: 1.5; }

.reading-content {
  padding: 32px 44px; max-width: 720px; width: 100%;
  margin: 0 auto;
}
.reading-image {
  width: 100%; aspect-ratio: 1.91 / 1; background: linear-gradient(135deg, #edf0f8, #dfe5f0);
  color: var(--muted2);
  overflow: hidden; border-radius: var(--r); margin-bottom: 16px;
  position: relative;
}
.reading-image img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  z-index: 1;
}
.reading-image-fallback {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; opacity: 0.4;
}
.reading-image-fallback svg { width: 64px; height: 64px; }
.reading-meta-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 10px; font-size: 11px; color: var(--muted);
}
.reading-meta-row .item-source-badge {
  background: var(--bg); padding: 4px 9px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--navy);
}
.reading-meta-row .item-source-badge img { width: 12px; height: 12px; border-radius: 2px; }
.reading-meta-row .item-tab-badge { padding: 4px 9px; font-size: 10px; }
.reading-title {
  font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1.25;
  margin-bottom: 10px; letter-spacing: -.3px;
}
.reading-source-link {
  font-size: 12px; color: var(--teal-deep); text-decoration: none; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
  margin-bottom: 16px;
}
.reading-source-link:hover { text-decoration: underline; }
.reading-desc {
  font-size: 14px; color: #4b5876; line-height: 1.65; margin-bottom: 18px;
}
.reading-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }
.reading-stats {
  display: flex; gap: 20px; padding: 12px 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  margin-bottom: 18px; font-size: 11px; color: var(--muted);
  flex-wrap: wrap;
}
.reading-stats strong { color: var(--navy); font-weight: 700; }

.reading-section-label {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 8px; margin-top: 4px;
}

.reading-reactions { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.reading-reaction-btn {
  background: #fff; border: 1.5px solid var(--border-m);
  border-radius: 22px; padding: 6px 13px; font-size: 12px; cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  font-weight: 600; color: var(--muted);
  min-width: 140px; justify-content: center;
  flex-shrink: 0;
}
.reading-reaction-btn:hover { border-color: var(--teal-deep); color: var(--navy); }
.reading-reaction-btn.active {
  background: var(--amber-tint); border-color: var(--amber); color: var(--amber);
}
.reading-reaction-count { font-size: 11px; font-weight: 700; }
.reading-reaction-btn svg { width: 13px; height: 13px; }

.reading-categorize { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
.reading-cat-btn {
  flex: 1; min-width: 80px; padding: 9px 8px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m); background: #fff; cursor: pointer;
  text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
  transition: all .15s;
}
.reading-cat-btn:hover { border-color: var(--teal-deep); color: var(--navy); }
.reading-cat-btn.selected { border-color: var(--teal-deep); background: var(--teal-tint); color: var(--teal-deep); font-weight: 700; }

.reading-actions {
  display: flex; gap: 8px; padding: 16px 0;
  border-top: 1px solid var(--border); margin-top: 14px;
}
.reading-actions .btn { padding: 9px 18px; }

/* ── COMMENTS ── */
.comments-section {
  margin-top: 22px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.comments-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.comment-item {
  display: flex; gap: 10px; padding: 10px 12px;
  background: var(--bg); border-radius: var(--r-sm);
  border: 1px solid var(--border);
}
.comment-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--grad); color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.comment-body { flex: 1; min-width: 0; }
.comment-head {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 3px;
}
.comment-author { font-size: 12px; font-weight: 700; color: var(--navy); }
.comment-time { font-size: 10px; color: var(--muted); }
.comment-text { font-size: 12px; color: #4b5876; line-height: 1.5; word-wrap: break-word; }
.comment-actions {
  display: flex; gap: 2px; margin-left: auto;
  opacity: 0; transition: opacity .15s;
}
.comment-item:hover .comment-actions { opacity: 1; }
.comment-action {
  background: none; border: none; cursor: pointer;
  color: var(--muted); padding: 3px 6px;
  border-radius: 4px; line-height: 1;
  display: inline-flex; align-items: center;
  font-size: 13px;
}
.comment-action:hover { background: rgba(25,33,102,0.08); color: var(--navy); }
.comment-action.danger:hover { background: var(--red-tint); color: var(--red); }

.comment-edited {
  color: var(--muted2); font-style: italic; font-weight: 400;
  margin-left: 4px; font-size: 10px;
}

.comment-foot {
  display: flex; align-items: center; gap: 6px; margin-top: 5px;
}
.comment-like {
  background: none; border: 1px solid transparent; cursor: pointer;
  color: var(--muted); padding: 3px 9px; border-radius: 12px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600;
  transition: all .12s;
  font-family: 'Inter', sans-serif;
}
.comment-like:hover { background: rgba(228,0,58,0.08); color: var(--red); border-color: rgba(228,0,58,0.2); }
.comment-like.active { color: var(--red); background: rgba(228,0,58,0.06); }
.comment-like.active:hover { background: rgba(228,0,58,0.14); border-color: rgba(228,0,58,0.3); }

.comment-edit-textarea {
  width: 100%; padding: 8px 10px; border-radius: var(--r-sm);
  border: 1.5px solid var(--teal-deep); background: #fff;
  font-size: 12px; font-family: 'Inter', sans-serif; color: var(--navy);
  resize: vertical; min-height: 50px;
  outline: none; line-height: 1.5;
  margin: 4px 0;
  box-shadow: 0 0 0 3px rgba(0,196,208,0.12);
}
.comment-edit-actions {
  display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px;
}
.comment-item.editing {
  background: rgba(0,196,208,0.04);
  border-color: rgba(0,196,208,0.3);
}
.comment-item.editing .comment-actions { opacity: 0 !important; }

/* Inline comments preview likes */
.comment-preview-likes {
  display: inline-flex; align-items: center; gap: 2px;
  color: var(--red); font-size: 10px; font-weight: 700;
  margin-left: 6px;
}
.comment-preview-likes svg { width: 9px; height: 9px; }
.comments-empty {
  font-size: 12px; color: var(--muted); padding: 14px; text-align: center;
  background: var(--bg); border-radius: var(--r-sm);
}

.comment-form {
  display: flex; gap: 8px; align-items: flex-end;
}
.comment-form textarea {
  flex: 1; padding: 9px 12px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m); background: #fff;
  font-size: 12px; font-family: 'Inter', sans-serif; color: var(--navy);
  resize: vertical; min-height: 38px; max-height: 120px;
  outline: none; transition: all .15s;
}
.comment-form textarea:focus { border-color: var(--teal-deep); box-shadow: 0 0 0 3px rgba(0,196,208,0.12); }
.comment-form button {
  padding: 9px 14px; height: 38px; flex-shrink: 0;
}

/* ── MODAL ── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(25,33,102,.45); backdrop-filter: blur(6px);
  z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
}
#modal-overlay.hidden { display: none; }
.modal-box {
  background: #fff; border-radius: var(--r); padding: 0;
  width: 560px; max-width: 100%; max-height: 90vh; overflow: hidden;
  box-shadow: 0 24px 70px rgba(25,33,102,.20); border: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.modal-box.modal-wide { width: 720px; }
.modal-box.modal-narrow { width: 440px; }
.modal-head {
  padding: 22px 26px 14px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 17px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--muted); }
.modal-body { padding: 20px 26px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 14px 26px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end; background: var(--bg2);
}

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; font-weight: 800; color: var(--muted);
  margin-bottom: 5px; letter-spacing: 0.06em; text-transform: uppercase;
}
.field input, .field textarea, .field select {
  width: 100%; padding: 9px 12px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m);
  font-size: 13px; outline: none; color: var(--navy); background: var(--bg2);
  transition: all .15s; font-family: 'Inter', sans-serif;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--teal-deep); background: #fff; box-shadow: 0 0 0 3px rgba(0,196,208,0.12);
}
.field textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.settings-section textarea {
  font-family: 'SFMono-Regular', 'Consolas', monospace; font-size: 12px;
}
.settings-section textarea:disabled {
  background: var(--bg2); color: var(--muted); cursor: not-allowed; opacity: 0.85;
}
.field-help { font-size: 11px; color: var(--muted); margin-top: 4px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
  padding: 9px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; border: 1.5px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary {
  background: #1a5c8f; color: #fff;
  box-shadow: none;
}
.btn-primary:hover { background: #1a6ea8; box-shadow: none; transform: none; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
.btn-secondary {
  background: #fff; color: var(--navy); border-color: var(--border-m);
}
.btn-secondary:hover { background: var(--bg2); border-color: var(--teal-deep); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--navy-tint); color: var(--navy); }
.btn-danger { background: #fff; color: var(--red); border-color: rgba(228,0,58,0.25); }
.btn-danger:hover { background: var(--red-tint); border-color: var(--red); }

/* Tab selector in add modal */
.tab-selector { display: flex; gap: 6px; flex-wrap: wrap; }
.tab-option {
  flex: 1; min-width: 80px; padding: 10px 8px; border-radius: var(--r-sm);
  border: 1.5px solid var(--border-m); background: var(--bg2); cursor: pointer;
  text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
  transition: all .15s;
}
.tab-option:hover { border-color: var(--teal-deep); color: var(--navy); }
.tab-option.selected { border-color: var(--cat-color, var(--teal-deep)); background: rgba(0,0,0,0.03); color: var(--navy); font-weight: 600; }

/* Tag input */
.tag-input-wrap {
  display: flex; flex-wrap: wrap; gap: 5px; padding: 7px;
  border: 1.5px solid var(--border-m); border-radius: var(--r-sm); background: var(--bg2);
  min-height: 38px; align-items: center;
}
.tag-input-wrap:focus-within { border-color: var(--teal-deep); background: #fff; box-shadow: 0 0 0 3px rgba(0,196,208,0.12); }
.tag-pill {
  background: var(--teal-tint); color: var(--teal-deep); border-radius: 5px;
  padding: 2px 6px 2px 8px; font-size: 11px; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.tag-pill button {
  background: none; border: none; color: var(--teal-deep); cursor: pointer; font-size: 14px;
  line-height: 1; padding: 0; opacity: 0.6;
}
.tag-pill button:hover { opacity: 1; }
.tag-input {
  flex: 1; min-width: 80px; border: none; outline: none; background: transparent;
  font-size: 12px; padding: 2px 4px;
}
.tag-suggestions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag-suggestion {
  background: rgba(255,255,255,0.6); border: 1px dashed rgba(25,33,102,0.25);
  color: var(--muted); border-radius: 5px; padding: 1px 7px; font-size: 10px;
  cursor: pointer; transition: all .15s;
}
.tag-suggestion:hover { background: var(--teal-tint); color: var(--teal-deep); border-style: solid; border-color: var(--teal-deep); }

/* Detail modal */
.detail-image {
  width: 100%; aspect-ratio: 1.91 / 1; background: linear-gradient(135deg, #edf0f8, #dfe5f0);
  display: flex; align-items: center; justify-content: center; color: var(--muted2); font-size: 60px;
  overflow: hidden; border-radius: var(--r); margin-bottom: 14px;
}
.detail-image img { width: 100%; height: 100%; object-fit: cover; }
.detail-title { font-size: 18px; font-weight: 800; color: var(--navy); line-height: 1.3; margin-bottom: 6px; }
.detail-source-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.detail-source-link {
  font-size: 12px; color: var(--teal-deep); text-decoration: none; font-weight: 700;
  display: inline-flex; align-items: center; gap: 4px;
}
.detail-source-link:hover { text-decoration: underline; }
.detail-desc { font-size: 13px; color: #4b5876; line-height: 1.65; margin-bottom: 16px; }
.detail-meta-row {
  display: flex; gap: 16px; padding: 10px 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); margin-bottom: 14px; font-size: 11px; color: var(--muted);
  flex-wrap: wrap;
}
.detail-meta-row strong { color: var(--navy); font-weight: 700; }
.detail-reactions {
  display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
}
.detail-reaction-btn {
  background: rgba(255,255,255,0.6); border: 1.5px solid var(--border-m);
  border-radius: 22px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
  font-weight: 500; color: var(--muted);
}
.detail-reaction-btn:hover { border-color: var(--teal-deep); color: var(--navy); }
.detail-reaction-btn.active {
  background: var(--amber-tint); border-color: var(--amber); color: var(--amber);
}
.detail-reaction-count { font-size: 11px; font-weight: 700; }
.detail-reactors { font-size: 10px; color: var(--muted); opacity: 0.8; }

/* Settings */
.settings-section {
  margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.settings-section:last-child { border-bottom: none; }
.settings-section-title { font-size: 12px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
.settings-section-sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.55; }
.settings-section-sub code { background: var(--navy-tint); padding: 1px 5px; border-radius: 4px; font-family: 'SFMono-Regular', monospace; font-size: 11px; color: var(--navy); }
.test-result {
  margin-top: 8px; padding: 8px 12px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600;
}
.test-result.success { background: var(--green-tint); color: var(--green); border: 1px solid rgba(61,158,74,0.25); }
.test-result.error   { background: var(--red-tint); color: var(--red); border: 1px solid rgba(228,0,58,0.25); }
.test-result.loading { background: var(--navy-tint); color: var(--muted); border: 1px solid var(--border); }

/* Loading spinner */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(0,196,208,0.20); border-top-color: var(--teal-deep);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-overlay {
  position: absolute; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; z-index: 50;
  border-radius: inherit;
}

/* ── History ── */
.history-day-label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  letter-spacing: 0.12em; padding: 14px 4px 6px;
  position: sticky; top: -20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(4px);
  z-index: 1; border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.history-day-label:first-child { padding-top: 4px; }
.history-entry {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 4px; border-bottom: 1px solid var(--border);
  font-size: 12px; line-height: 1.5;
}
.history-entry:last-child { border-bottom: none; }
.history-icon {
  flex-shrink: 0; width: 24px; text-align: center; margin-top: -1px;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.history-text {
  flex: 1; color: var(--navy);
}
.history-text strong { font-weight: 700; color: var(--teal-deep); }
.history-item-link {
  color: var(--navy); text-decoration: none; font-weight: 600;
  border-bottom: 1px dotted var(--border-m); transition: all .15s;
}
.history-item-link:hover { color: var(--teal-deep); border-bottom-color: var(--teal-deep); }
.history-item-deleted {
  color: var(--muted); text-decoration: line-through; font-weight: 500;
}
.history-time {
  font-size: 10px; color: var(--muted2); flex-shrink: 0;
  font-variant-numeric: tabular-nums; padding-top: 2px;
}

/* ── FAB (Floating Action Button) ── */
.fab {
  position: fixed; bottom: 28px; right: 28px; z-index: 90;
  background: #1a5c8f;
  color: #fff; border: none; cursor: pointer;
  border-radius: 8px; padding: 11px 20px;
  font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
  box-shadow: 0 4px 16px rgba(25,33,102,0.25);
  display: flex; align-items: center; gap: 8px;
  transition: all .15s;
}
.fab:hover {
  background: #1a6ea8;
  box-shadow: 0 6px 20px rgba(26,94,168,0.30);
  transform: translateY(-1px);
}
.fab:active { transform: translateY(0); }
.fab-label { line-height: 1; }

/* Responsive */
@media (max-width: 880px) {
  /* Mobile: hide reading pane, list fills width, modal opens on click */
  .items-list { width: 100%; flex: 1; border-right: none; }
  .reading-pane { display: none; }
  .topbar { padding: 0 14px; height: auto; flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
  .filterbar { padding: 10px 14px; }
  .modal-box { width: 100% !important; }
  .topbar-sub { display: none; }
  .fab { bottom: 18px; right: 18px; padding: 14px; border-radius: 50%; }
  .fab-label { display: none; }
}
</style>

<script>
// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
const STORAGE_KEY = 'ai-radar-settings';
const FEED_CACHE_KEY = 'ai-radar-feed-cache';
const FEED_PATH = 'feeds/team-ai.json';
const CORS_PROXY = 'https://corsproxy.io/?url=';

const REACTION_ICONS = {
  important:  `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,

  tried:      `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
};

const REACTIONS = [
  { key: 'important',   emoji: REACTION_ICONS.important,   label: 'важно' },
  { key: 'must_read',   emoji: REACTION_ICONS.must_read,   label: 'must-read' },
  { key: 'watch_later', emoji: REACTION_ICONS.watch_later, label: 'ще го гледам' },
  { key: 'tried',       emoji: REACTION_ICONS.tried,       label: 'изпробвал' }
];

const TAB_LABELS = {
  feed: 'Feed', team: 'Team Feed', claude: 'Claude', gemini: 'Gemini', chatgpt: 'ChatGPT', other: 'Other'
};
const TAB_KEYS = ['feed', 'team', 'claude', 'gemini', 'chatgpt', 'other'];
const MODEL_CATEGORIES = ['claude', 'gemini', 'chatgpt', 'other'];

// Admin (filter rules editor). Match is case-insensitive on userName.
const ADMIN_NAMES = ['boris'];

// Default filter config — used if config doesn't yet exist in GitHub
const DEFAULT_FILTER_CONFIG = {
  // Negative keywords — items whose title or description match any of these are skipped by Worker
  blacklistKeywords: [
    'taylor swift', 'kardashian', 'celebrity', 'gossip',
    'crypto pump', 'meme coin', 'nft drop',
    'trump', 'politics', 'election',
  ],
  // Domains/patterns that should be auto-categorized into a model tab
  // Each rule: { pattern: 'string', category: 'claude'|'gemini'|'chatgpt' }
  categorizationWhitelist: [
    { pattern: 'anthropic.com',  category: 'claude' },
    { pattern: 'claude.ai',      category: 'claude' },
    { pattern: 'openai.com',     category: 'chatgpt' },
    { pattern: 'chatgpt.com',    category: 'chatgpt' },
    { pattern: 'deepmind.google', category: 'gemini' },
    { pattern: 'gemini.google',  category: 'gemini' },
  ],
  // Disabled sources — Worker skips these. Names must match those defined in worker.js exactly.
  disabledSources: [],
};

const COMMON_TAGS = ['release', 'coding', 'agents', 'research', 'tutorial', 'pricing', 'opinion', 'tool', 'benchmark', 'paper', 'discussion'];

const S = {
  settings: {
    userName: '',
    githubRepo: '',
    githubToken: '',
    viewMode: 'list',  // 'list' | 'grid'
  },
  feed: { version: 1, items: [], activity: [], filterConfig: null, _sha: null },
  ui: {
    activeTab: 'team',
    contentType: 'all',
    searchQuery: '',
    sharedByFilter: '',
    tagFilter: '',
    showOlder: true,   // true = show all (default), false = last 7 days only
    selectedItemId: null,    // currently selected item in reading pane
    editingCommentId: null   // currently editing comment id
  },
  syncing: false,
  initialLoadDone: false
};

// ─────────────────────────────────────────────────────────────
// SETTINGS PERSISTENCE
// ─────────────────────────────────────────────────────────────
function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.assign(S.settings, parsed);
    }
  } catch (e) { console.warn('Settings load failed', e); }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.settings)); }
  catch (e) { console.warn('Settings save failed', e); }
}

function saveFeedCache() {
  try {
    const payload = {
      version: S.feed.version || 1,
      items: S.feed.items,
      activity: S.feed.activity || [],
      filterConfig: S.feed.filterConfig || null,
      _cachedAt: new Date().toISOString()
    };
    localStorage.setItem(FEED_CACHE_KEY, JSON.stringify(payload));
  } catch (e) {
    // localStorage full / disabled — silent fail; feed still loads from GitHub
    console.warn('Feed cache save failed:', e.message);
  }
}

function loadFeedCache() {
  try {
    const raw = localStorage.getItem(FEED_CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function settingsConfigured() {
  return !!(S.settings.githubRepo && S.settings.githubToken && S.settings.userName);
}

function isAdmin() {
  const me = (S.settings.userName || '').trim().toLowerCase();
  return ADMIN_NAMES.includes(me);
}

function getFilterConfig() {
  return S.feed.filterConfig || DEFAULT_FILTER_CONFIG;
}

function updateFabVisibility() {
  const fab = document.getElementById('fab-add');
  if (!fab) return;
  // Hide FAB on Feed tab — auto-only, manual additions not allowed there
  fab.style.display = S.ui.activeTab === 'feed' ? 'none' : '';
}

// ─────────────────────────────────────────────────────────────
// STATUS INDICATOR
// ─────────────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('save-dot');
  if (dot) {
    dot.className = 'save-dot ' + state;
    dot.title = text;
  }
  const txt = document.getElementById('sidebar-status-text');
  if (txt) txt.textContent = text;
}

// ─────────────────────────────────────────────────────────────
// GITHUB API
// ─────────────────────────────────────────────────────────────
async function ghHeaders() {
  return {
    'Authorization': `Bearer ${S.settings.githubToken}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json'
  };
}

async function ghLoadFeed() {
  if (!settingsConfigured()) return;
  setStatus('saving', 'Loading...');
  try {
    const url = `https://api.github.com/repos/${S.settings.githubRepo}/contents/${FEED_PATH}`;
    const res = await fetch(url, { headers: await ghHeaders() });
    if (res.status === 404) {
      // File doesn't exist yet — start with empty feed
      S.feed = { version: 1, items: [], activity: [], filterConfig: JSON.parse(JSON.stringify(DEFAULT_FILTER_CONFIG)), _sha: null };
      setStatus('saved', 'New feed');
      return;
    }
    if (!res.ok) throw new Error(`GitHub ${res.status}: ${await res.text()}`);
    const data = await res.json();
    const content = atob(data.content.replace(/\s/g, ''));
    // Properly decode UTF-8 (atob returns binary string)
    const decoded = decodeURIComponent(escape(content));
    const parsed = JSON.parse(decoded);
    S.feed = { ...parsed, _sha: data.sha };
    migrateItems();
    saveFeedCache();
    setStatus('saved', `Synced · ${S.feed.items.length} items`);
  } catch (err) {
    console.error('Load feed error', err);
    setStatus('error', 'Load failed');
    throw err;
  }
}

function migrateItems() {
  // Ensure activity log exists
  if (!Array.isArray(S.feed.activity)) S.feed.activity = [];
  // Ensure filterConfig exists
  if (!S.feed.filterConfig) {
    S.feed.filterConfig = JSON.parse(JSON.stringify(DEFAULT_FILTER_CONFIG));
  }
  // Migrate old schema (single `tab` field) to new (source + category)
  let migrated = 0;
  S.feed.items.forEach(it => {
    // Ensure comments array exists on every item, and each comment has likes array
    if (!Array.isArray(it.comments)) it.comments = [];
    it.comments.forEach(c => {
      if (!Array.isArray(c.likes)) c.likes = [];
    });
    if (it.source !== undefined && it.category !== undefined) return;
    if (it.tab === 'feed') { it.source = 'feed'; it.category = null; }
    else if (it.tab === 'team') { it.source = 'team'; it.category = null; }
    else if (['claude', 'gemini', 'chatgpt', 'other'].includes(it.tab)) {
      it.source = 'team';
      it.category = it.tab;
    } else {
      it.source = 'team';
      it.category = null;
    }
    delete it.tab;
    migrated++;
  });
  if (migrated > 0) console.log(`Migrated ${migrated} items to new schema`);
}

async function ghSaveFeed(retry = 0) {
  if (!settingsConfigured()) {
    setStatus('error', 'Settings missing');
    return false;
  }
  if (S.syncing) {
    // Queue: wait briefly and try again
    await new Promise(r => setTimeout(r, 200));
    return ghSaveFeed(retry);
  }
  S.syncing = true;
  setStatus('saving', 'Saving...');
  try {
    const url = `https://api.github.com/repos/${S.settings.githubRepo}/contents/${FEED_PATH}`;
    const payload = {
      version: S.feed.version,
      items: S.feed.items,
      activity: S.feed.activity || [],
      filterConfig: S.feed.filterConfig || DEFAULT_FILTER_CONFIG,
    };
    const jsonStr = JSON.stringify(payload, null, 2);
    // Properly encode UTF-8 to base64
    const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));
    const body = {
      message: `Update feed (${S.settings.userName || 'unknown'})`,
      content: base64Content,
      ...(S.feed._sha ? { sha: S.feed._sha } : {})
    };
    const res = await fetch(url, {
      method: 'PUT',
      headers: await ghHeaders(),
      body: JSON.stringify(body)
    });
    if (res.status === 409 || res.status === 422) {
      // SHA conflict — someone else wrote in between
      if (retry < 2) {
        S.syncing = false;
        await mergeRemoteAndRetry();
        return ghSaveFeed(retry + 1);
      } else {
        throw new Error('Conflict resolution failed after retries');
      }
    }
    if (!res.ok) throw new Error(`GitHub ${res.status}: ${await res.text()}`);
    const data = await res.json();
    S.feed._sha = data.content.sha;
    saveFeedCache();
    setStatus('saved', `Synced · ${S.feed.items.length} items`);
    S.syncing = false;
    return true;
  } catch (err) {
    console.error('Save feed error', err);
    setStatus('error', 'Save failed');
    S.syncing = false;
    return false;
  }
}

async function mergeRemoteAndRetry() {
  // Fetch latest from server, merge our local changes, then retry save
  const localItems = S.feed.items.slice();
  const localActivity = (S.feed.activity || []).slice();
  await ghLoadFeed();
  // Merge items: keep all remote items, overlay our local items (by id)
  const remoteById = new Map(S.feed.items.map(it => [it.id, it]));
  for (const localItem of localItems) {
    const remote = remoteById.get(localItem.id);
    if (!remote) {
      remoteById.set(localItem.id, localItem);
    } else {
      const localTs = new Date(localItem._updatedAt || localItem.addedAt).getTime();
      const remoteTs = new Date(remote._updatedAt || remote.addedAt).getTime();
      if (localTs >= remoteTs) {
        remoteById.set(localItem.id, localItem);
      }
    }
  }
  S.feed.items = Array.from(remoteById.values());
  // Merge activity by id, keep newest first
  const actById = new Map((S.feed.activity || []).map(a => [a.id, a]));
  for (const localAct of localActivity) {
    if (!actById.has(localAct.id)) actById.set(localAct.id, localAct);
  }
  S.feed.activity = Array.from(actById.values())
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .slice(0, ACTIVITY_CAP);
}

async function ghTestConnection() {
  if (!S.settings.githubRepo || !S.settings.githubToken) {
    return { ok: false, error: 'Repo and token required' };
  }
  try {
    const url = `https://api.github.com/repos/${S.settings.githubRepo}`;
    const res = await fetch(url, { headers: await ghHeaders() });
    if (res.status === 404) return { ok: false, error: 'Repo not found or no access' };
    if (res.status === 401) return { ok: false, error: 'Invalid token' };
    if (!res.ok) return { ok: false, error: `GitHub ${res.status}` };
    const data = await res.json();
    return { ok: true, repoName: data.full_name, private: data.private };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// ─────────────────────────────────────────────────────────────
// METADATA FETCHING (Open Graph)
// ─────────────────────────────────────────────────────────────
async function fetchMetadata(url) {
  // Detect content type from URL
  const contentType = detectContentType(url);

  // Try platform-specific oEmbed APIs first (no CORS issues)
  const oembed = await tryOembed(url);
  if (oembed) {
    return { ...oembed, contentType, domain: getDomain(url) };
  }

  // Fall back to generic CORS proxy + Open Graph
  try {
    const proxyUrl = CORS_PROXY + encodeURIComponent(url);
    const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error(`Proxy returned ${res.status}`);
    const html = await res.text();
    const meta = parseMetadata(html, url);
    meta.contentType = contentType;
    return meta;
  } catch (err) {
    console.warn('Metadata fetch failed:', err);
    return {
      title: '',
      description: '',
      image: '',
      domain: getDomain(url),
      contentType,
      _fetchFailed: true
    };
  }
}

async function tryOembed(url) {
  let oembedUrl = null;

  // YouTube
  const ytId = extractYoutubeId(url);
  if (ytId) {
    oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
  }
  // Vimeo
  else if (/vimeo\.com\/\d+/.test(url)) {
    oembedUrl = `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`;
  }

  if (!oembedUrl) return null;

  try {
    const res = await fetch(oembedUrl, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return null;
    const data = await res.json();
    // For YouTube, prefer high-res thumbnail constructed from ID
    let image = data.thumbnail_url || '';
    if (ytId) image = `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`;
    return {
      title: data.title || '',
      description: data.author_name ? `By ${data.author_name}` : '',
      image
    };
  } catch (e) {
    console.warn('oEmbed fetch failed:', e);
    return null;
  }
}

function extractYoutubeId(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function parseMetadata(html, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const get = (sel) => {
    const el = doc.querySelector(sel);
    return el ? (el.getAttribute('content') || el.textContent || '').trim() : '';
  };
  const title = get('meta[property="og:title"]') || get('meta[name="twitter:title"]') || get('title');
  const description = get('meta[property="og:description"]') || get('meta[name="twitter:description"]') || get('meta[name="description"]');
  let image = get('meta[property="og:image"]') || get('meta[name="twitter:image"]');
  // Handle relative image URLs
  if (image && !image.startsWith('http')) {
    try { image = new URL(image, url).href; } catch (e) { image = ''; }
  }
  return {
    title: title.slice(0, 300),
    description: description.slice(0, 500),
    image,
    domain: getDomain(url)
  };
}

function detectContentType(url) {
  if (/youtube\.com|youtu\.be|vimeo\.com|twitch\.tv|tiktok\.com/.test(url)) return 'video';
  if (/spotify\.com\/episode|spotify\.com\/show|podcasts\.apple\.com|podcasts\.google\.com|overcast\.fm|pca\.st|castbox\.fm|podbean\.com|anchor\.fm|soundcloud\.com|player\.fm|stitcher\.com|simplecast\.com|buzzsprout\.com|libsyn\.com|transistor\.fm|fireside\.fm|podtail\.com/.test(url)) return 'podcast';
  return 'article';
}

function getDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch (e) { return ''; }
}

// ─────────────────────────────────────────────────────────────
// ACTIVITY LOG
// ─────────────────────────────────────────────────────────────
const ACTIVITY_CAP = 500;

function logActivity(type, item, extras = {}) {
  if (!S.feed.activity) S.feed.activity = [];
  S.feed.activity.unshift({
    id: 'a_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
    type,                                  // 'add' | 'delete' | 'categorize'
    itemId: item.id,
    itemTitle: item.title || item.url,
    itemUrl: item.url,
    itemSource: item.source,
    by: S.settings.userName || 'unknown',
    at: new Date().toISOString(),
    ...extras
  });
  // Cap to avoid runaway file size
  if (S.feed.activity.length > ACTIVITY_CAP) {
    S.feed.activity = S.feed.activity.slice(0, ACTIVITY_CAP);
  }
}

// ─────────────────────────────────────────────────────────────
// URL NORMALIZATION & DUPLICATE DETECTION
// ─────────────────────────────────────────────────────────────
const TRACKING_PARAMS = new Set([
  'utm_source','utm_medium','utm_campaign','utm_term','utm_content',
  'fbclid','gclid','dclid','msclkid','yclid',
  'ref','ref_src','source','referrer','origin',
  'mc_cid','mc_eid','_ga','_gl','igshid','si','feature','spm'
]);

function normalizeUrl(rawUrl) {
  if (!rawUrl) return '';
  try {
    const u = new URL(rawUrl.trim());
    // YouTube: canonicalize to youtube.com/watch?v=ID (strips youtu.be, m.youtube, embed/, shorts/)
    const ytId = extractYoutubeId(rawUrl);
    if (ytId) return `youtube.com/watch?v=${ytId}`;
    // Lowercase host, strip www
    let host = u.hostname.toLowerCase().replace(/^www\./, '');
    // Strip tracking params
    const params = new URLSearchParams(u.search);
    const cleanParams = new URLSearchParams();
    Array.from(params.keys()).sort().forEach(k => {
      if (!TRACKING_PARAMS.has(k.toLowerCase())) cleanParams.append(k, params.get(k));
    });
    const qs = cleanParams.toString();
    // Strip trailing slash from path
    let path = u.pathname.replace(/\/+$/, '') || '/';
    return host + path + (qs ? '?' + qs : '');
  } catch (e) {
    return rawUrl.trim().toLowerCase();
  }
}

function findDuplicate(url) {
  const norm = normalizeUrl(url);
  if (!norm) return null;
  return S.feed.items.find(it => normalizeUrl(it.url) === norm) || null;
}
function genId() {
  return 'i_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function newItem({ url, title, description, image, domain, contentType, source, category, tags }) {
  return {
    id: genId(),
    url,
    title: title || url,
    description: description || '',
    image: image || '',
    domain: domain || getDomain(url),
    contentType: contentType || 'article',
    source: source || 'team',         // 'feed' (auto-fetched) | 'team' (manual)
    category: category || null,       // null | 'claude' | 'gemini' | 'chatgpt' | 'other'
    tags: tags || [],
    addedAt: new Date().toISOString(),
    addedBy: S.settings.userName || 'unknown',
    readBy: [S.settings.userName || 'unknown'],
    reactions: REACTIONS.reduce((a, r) => (a[r.key] = [], a), {}),
    comments: [],
    _updatedAt: new Date().toISOString()
  };
}

function findItem(id) { return S.feed.items.find(it => it.id === id); }

function toggleReaction(itemId, key) {
  const it = findItem(itemId);
  if (!it) return;
  const me = S.settings.userName || 'unknown';
  if (!it.reactions[key]) it.reactions[key] = [];
  const idx = it.reactions[key].indexOf(me);
  if (idx >= 0) it.reactions[key].splice(idx, 1);
  else it.reactions[key].push(me);
  it._updatedAt = new Date().toISOString();
  ghSaveFeed();
  render();
}

function markAsRead(itemId) {
  const it = findItem(itemId);
  if (!it) return;
  if (!it.readBy) it.readBy = [];
  const me = S.settings.userName || 'unknown';
  if (!it.readBy.includes(me)) {
    it.readBy.push(me);
    it._updatedAt = new Date().toISOString();
    ghSaveFeed();
  }
}

function setItemCategory(itemId, category) {
  const it = findItem(itemId);
  if (!it) return;
  if (it.category === category) return;  // no change
  const oldCategory = it.category;
  it.category = category;
  it._updatedAt = new Date().toISOString();
  logActivity('categorize', it, { oldCategory, newCategory: category });
  ghSaveFeed();
  render();
}

function deleteItem(itemId) {
  const idx = S.feed.items.findIndex(it => it.id === itemId);
  if (idx >= 0) {
    const it = S.feed.items[idx];
    logActivity('delete', it);
    S.feed.items.splice(idx, 1);
    ghSaveFeed();
    render();
    closeModal();
  }
}

function matchesActiveTab(it, tab) {
  if (tab === 'feed') return it.source === 'feed';
  if (tab === 'team') return it.source === 'team';
  // model tabs filter by category — items can be in source tab AND in their category tab
  return it.category === tab;
}

function getFilteredItems() {
  const me = S.settings.userName || 'unknown';
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  let items = S.feed.items.slice();

  // Tab filter
  items = items.filter(it => matchesActiveTab(it, S.ui.activeTab));

  // Content type filter
  if (S.ui.contentType !== 'all') {
    items = items.filter(it => it.contentType === S.ui.contentType);
  }

  // Search filter
  if (S.ui.searchQuery) {
    const q = S.ui.searchQuery.toLowerCase();
    items = items.filter(it => {
      const haystack = [it.title, it.description, ...(it.tags || []), it.domain, it.addedBy].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }

  // Shared by filter
  if (S.ui.sharedByFilter) {
    items = items.filter(it => it.addedBy === S.ui.sharedByFilter);
  }

  // Tag filter
  if (S.ui.tagFilter) {
    items = items.filter(it => (it.tags || []).includes(S.ui.tagFilter));
  }

  // Recency filter (default: last 7 days)
  if (!S.ui.showOlder) {
    items = items.filter(it => new Date(it.addedAt).getTime() >= sevenDaysAgo);
  }

  // Sort by date desc only — read state is shown via the unread dot indicator,
  // not via reordering, so items stay in stable position when selected.
  items.sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));

  return items;
}

function countWithFilters(overrides = {}) {
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const f = { ...S.ui, ...overrides };
  let items = S.feed.items.slice();
  if (f.activeTab) items = items.filter(it => matchesActiveTab(it, f.activeTab));
  if (f.contentType && f.contentType !== 'all') items = items.filter(it => it.contentType === f.contentType);
  if (f.searchQuery) {
    const q = f.searchQuery.toLowerCase();
    items = items.filter(it => {
      const haystack = [it.title, it.description, ...(it.tags || []), it.domain, it.addedBy].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  if (f.sharedByFilter) items = items.filter(it => it.addedBy === f.sharedByFilter);
  if (f.tagFilter) items = items.filter(it => (it.tags || []).includes(f.tagFilter));
  if (!f.showOlder) items = items.filter(it => new Date(it.addedAt).getTime() >= sevenDaysAgo);
  return items.length;
}

function updateTabCounts() {
  TAB_KEYS.forEach(tab => {
    const el = document.querySelector(`[data-count="${tab}"]`);
    if (el) el.textContent = countWithFilters({ activeTab: tab });
  });
  ['all', 'article', 'video', 'podcast', 'other'].forEach(type => {
    const el = document.querySelector(`[data-type-count="${type}"]`);
    if (el) el.textContent = countWithFilters({ contentType: type });
  });
}

function updateFilterDropdowns() {
  // Shared by — count items from each member with all OTHER filters applied
  const sharedBySet = new Set();
  S.feed.items.forEach(it => sharedBySet.add(it.addedBy || 'unknown'));
  const sharedSelect = document.getElementById('sharedby-filter');
  const currentShared = sharedSelect.value;
  const sharedAllCount = countWithFilters({ sharedByFilter: '' });
  sharedSelect.innerHTML = `<option value="">All members (${sharedAllCount})</option>` +
    Array.from(sharedBySet).sort().map(n => {
      const c = countWithFilters({ sharedByFilter: n });
      return `<option value="${escapeAttr(n)}">${escapeHtml(n)} (${c})</option>`;
    }).join('');
  sharedSelect.value = currentShared;

  // Tags — count with all OTHER filters
  const tagSet = new Set();
  S.feed.items.forEach(it => (it.tags || []).forEach(t => tagSet.add(t)));
  const tagSelect = document.getElementById('tag-filter');
  const currentTag = tagSelect.value;
  const tagAllCount = countWithFilters({ tagFilter: '' });
  tagSelect.innerHTML = `<option value="">All tags (${tagAllCount})</option>` +
    Array.from(tagSet).sort().map(t => {
      const c = countWithFilters({ tagFilter: t });
      return `<option value="${escapeAttr(t)}">#${escapeHtml(t)} (${c})</option>`;
    }).join('');
  tagSelect.value = currentTag;
}

function isMobile() {
  // Check if reading pane is actually hidden by CSS — works regardless of viewport size,
  // and correctly detects sandboxed iframe previews vs real mobile.
  const pane = document.getElementById('reading-pane');
  if (!pane) return true;
  return window.getComputedStyle(pane).display === 'none';
}

function renderRow(it) {
  const me = S.settings.userName || 'unknown';
  const isUnread = !(it.readBy || []).includes(me);
  const isSelected = S.ui.selectedItemId === it.id;
  const showCatBadge = ['claude', 'gemini', 'chatgpt', 'other'].includes(it.category);
  const tabBadge = showCatBadge ? `<span class="item-tab-badge tab-${it.category}">${TAB_LABELS[it.category]}</span>` : '';
  const typeSvg = renderTypeSvg(it.contentType);
  const typeIcon = (it.contentType === 'video' || it.contentType === 'podcast') ? `<div class="type-icon">${typeSvg}</div>` : '';
  const ago = timeAgo(it.addedAt);
  const sourceBadge = it.domain ? `<span class="item-source-badge">${faviconImg(it.domain)} ${escapeHtml(it.domain)}</span>` : '';

  // Compact mini-reactions: only the ones with counts > 0
  const reactionMini = REACTIONS.map(r => {
    const list = it.reactions?.[r.key] || [];
    if (list.length === 0) return '';
    return `<span class="mini-r">${r.emoji}<span>${list.length}</span></span>`;
  }).filter(Boolean).join('');

  // Comments badge (count only)
  const commentCount = (it.comments || []).length;
  const commentMini = commentCount > 0
    ? `<span class="mini-r" style="background:var(--navy-tint);color:var(--muted);"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${commentCount}</span></span>`
    : '';

  return `
    <div class="item-card ${isUnread ? 'unread' : ''} ${isSelected ? 'selected' : ''}" onclick="selectItem('${it.id}')">
      <div class="item-row-main">
        <div class="item-image">
          <div class="item-image-fallback">${typeSvg}</div>
          ${it.image ? `<img src="${escapeAttr(it.image)}" onerror="this.remove()" alt="">` : ''}
          ${typeIcon}
        </div>
        <div class="item-body">
          <div class="item-row-top">
            <div class="item-title">${escapeHtml(it.title)}</div>
            ${tabBadge}
          </div>
          ${it.description ? `<div class="item-desc">${escapeHtml(it.description)}</div>` : ''}
          <div class="item-foot">
            <span class="by">${escapeHtml(it.addedBy || 'unknown')}</span>
            <span class="item-foot-divider">·</span>
            <span>${ago}</span>
            <span class="item-foot-divider">·</span>
            ${sourceBadge}
            <div class="item-mini-reactions">${reactionMini}${commentMini}</div>
          </div>
        </div>
      </div>
      ${renderItemCommentsPreview(it)}
    </div>`;
}

function renderItemCommentsPreview(it) {
  const comments = it.comments || [];
  if (comments.length === 0) return '';

  // Show latest 2 comments (most recent at bottom, like social media)
  const latest = comments.slice(-2);
  const remaining = comments.length - latest.length;
  const heartIcon = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

  return `
    <div class="item-comments-preview">
      ${latest.map(c => {
        const initials = getInitials(c.author);
        const likeCount = Array.isArray(c.likes) ? c.likes.length : 0;
        const likeBadge = likeCount > 0
          ? `<span class="comment-preview-likes" title="${likeCount} like${likeCount > 1 ? 's' : ''}">${heartIcon}${likeCount}</span>`
          : '';
        return `
          <div class="comment-preview-row">
            <div class="comment-avatar-mini">${escapeHtml(initials)}</div>
            <div class="comment-preview-text"><strong>${escapeHtml(c.author || 'unknown')}:</strong> ${escapeHtml(c.text)}${likeBadge}</div>
          </div>`;
      }).join('')}
      ${remaining > 0 ? `<div class="comment-preview-more">+ ${remaining} more comment${remaining > 1 ? 's' : ''}</div>` : ''}
    </div>`;
}

function renderTypeSvg(contentType) {
  if (contentType === 'video') {
    return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`;

  return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;

function selectItem(itemId) {
  const it = findItem(itemId);
  if (!it) return;

  // On mobile, open as modal (legacy flow)
  if (isMobile()) {
    openItemDetail(itemId);
    return;
  }

  // Switching to a different item — clear any active comment edit
  if (S.ui.selectedItemId !== itemId) {
    S.ui.editingCommentId = null;
  }

  // Desktop: select for reading pane
  S.ui.selectedItemId = itemId;
  markAsRead(itemId);
  // Re-render only the affected items list rows for selection state, plus reading pane
  render();
}

function renderReadingPane() {

function renderComment(c, itemId, me) {
  const initials = getInitials(c.author);
  const isMine = c.author === me;
  const isAdminUser = isAdmin();
  const canDelete = isMine || isAdminUser;
  const canEdit = isMine; // only own comments are editable
  const isEditing = S.ui.editingCommentId === c.id;
  const likes = Array.isArray(c.likes) ? c.likes : [];
  const iLiked = likes.includes(me);
  const editedSuffix = c.editedAt
    ? `<span class="comment-edited" title="${escapeAttr('Edited ' + new Date(c.editedAt).toLocaleString())}">(edited)</span>`
    : '';

  if (isEditing) {
    return `
      <div class="comment-item editing">
        <div class="comment-avatar">${escapeHtml(initials)}</div>
        <div class="comment-body">
          <div class="comment-head">
            <span class="comment-author">${escapeHtml(c.author || 'unknown')}</span>
            <span class="comment-time">${timeAgo(c.at)}${editedSuffix}</span>
          </div>
          <textarea id="edit-comment-${c.id}" class="comment-edit-textarea" rows="2"
            onkeydown="if(event.key==='Escape'){cancelCommentEdit();} if(event.key==='Enter' && (event.ctrlKey || event.metaKey)){event.preventDefault(); saveCommentEdit('${itemId}','${c.id}');}">${escapeHtml(c.text)}</textarea>
          <div class="comment-edit-actions">
            <button class="btn btn-secondary" style="padding:5px 12px;font-size:11px;" onclick="cancelCommentEdit()">Cancel</button>
            <button class="btn btn-primary" style="padding:5px 12px;font-size:11px;" onclick="saveCommentEdit('${itemId}', '${c.id}')">Save</button>
          </div>
        </div>
      </div>`;
  }

  const editIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
  const heartIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="${iLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  const likeTooltip = likes.length > 0 ? `Liked by ${likes.join(', ')}` : 'Like';

  return `
    <div class="comment-item">
      <div class="comment-avatar">${escapeHtml(initials)}</div>
      <div class="comment-body">
        <div class="comment-head">
          <span class="comment-author">${escapeHtml(c.author || 'unknown')}</span>
          <span class="comment-time">${timeAgo(c.at)}${editedSuffix}</span>
          <div class="comment-actions">
            ${canEdit ? `<button class="comment-action" onclick="event.stopPropagation(); startEditComment('${c.id}')" title="Edit">${editIcon}</button>` : ''}
            ${canDelete ? `<button class="comment-action danger" onclick="event.stopPropagation(); deleteComment('${itemId}', '${c.id}')" title="Delete">×</button>` : ''}
          </div>
        </div>
        <div class="comment-text">${escapeHtml(c.text)}</div>
        <div class="comment-foot">
          <button class="comment-like ${iLiked ? 'active' : ''}" onclick="event.stopPropagation(); toggleCommentLike('${itemId}', '${c.id}')" title="${escapeAttr(likeTooltip)}">
            ${heartIcon}
            ${likes.length > 0 ? `<span>${likes.length}</span>` : ''}
          </button>
        </div>
      </div>
    </div>`;
}

function startEditComment(commentId) {
  S.ui.editingCommentId = commentId;
  renderReadingPane();
  // Focus textarea after DOM update, place cursor at end
  setTimeout(() => {
    const ta = document.getElementById('edit-comment-' + commentId);
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 0);
}

function cancelCommentEdit() {
  S.ui.editingCommentId = null;
  renderReadingPane();
}

function saveCommentEdit(itemId, commentId) {
  const it = findItem(itemId);
  if (!it) return;
  const c = (it.comments || []).find(c => c.id === commentId);
  if (!c) return;
  const ta = document.getElementById('edit-comment-' + commentId);
  if (!ta) return;
  const newText = ta.value.trim();
  if (!newText) return;
  if (newText === c.text) {
    // No change — just exit edit mode
    S.ui.editingCommentId = null;
    renderReadingPane();
    return;
  }
  c.text = newText;
  c.editedAt = new Date().toISOString();
  it._updatedAt = new Date().toISOString();
  S.ui.editingCommentId = null;
  ghSaveFeed();
  render();
}

function toggleCommentLike(itemId, commentId) {
  const it = findItem(itemId);
  if (!it) return;
  const c = (it.comments || []).find(c => c.id === commentId);
  if (!c) return;
  if (!Array.isArray(c.likes)) c.likes = [];
  const me = S.settings.userName || 'unknown';
  const idx = c.likes.indexOf(me);
  if (idx >= 0) c.likes.splice(idx, 1);
  else c.likes.push(me);
  it._updatedAt = new Date().toISOString();
  ghSaveFeed();
  render();
}

function submitComment(itemId) {
  const input = document.getElementById('comment-input-' + itemId);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const it = findItem(itemId);
  if (!it) return;
  if (!Array.isArray(it.comments)) it.comments = [];
  it.comments.push({
    id: 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
    author: S.settings.userName || 'unknown',
    text,
    at: new Date().toISOString(),
    likes: []
  });
  it._updatedAt = new Date().toISOString();
  input.value = '';
  ghSaveFeed();
  render();
}

function deleteComment(itemId, commentId) {
  const it = findItem(itemId);
  if (!it || !Array.isArray(it.comments)) return;
  it.comments = it.comments.filter(c => c.id !== commentId);
  it._updatedAt = new Date().toISOString();
  // Clear edit state if deleting the comment being edited
  if (S.ui.editingCommentId === commentId) S.ui.editingCommentId = null;
  ghSaveFeed();
  render();
}

async function testGithubConnection() {

async function saveSettingsFromModal() {
  const name = document.getElementById('set-name').value.trim();
  const repo = document.getElementById('set-repo').value.trim();
  const token = document.getElementById('set-token').value.trim();
  if (!name || !repo || !token) {
    alert('Name, repo, and token are required.');
    return;
  }
  S.settings.userName = name;
  S.settings.githubRepo = repo;
  S.settings.githubToken = token;
  saveSettings();

  // If admin, parse and save filter config too
  let configChanged = false;
  if (isAdmin()) {
    const blacklistEl = document.getElementById('cfg-blacklist');
    const whitelistEl = document.getElementById('cfg-whitelist');
    const disabledEl = document.getElementById('cfg-disabled');
    if (blacklistEl && whitelistEl && disabledEl) {
      const newConfig = {
        blacklistKeywords: parseLines(blacklistEl.value).map(s => s.toLowerCase()),
        categorizationWhitelist: parseWhitelist(whitelistEl.value),
        disabledSources: parseLines(disabledEl.value),
      };
      if (JSON.stringify(newConfig) !== JSON.stringify(S.feed.filterConfig)) {
        S.feed.filterConfig = newConfig;
        configChanged = true;
      }
    }
  }

  closeModal();
  try {
    if (configChanged) {
      // Save current state with new config
      await ghSaveFeed();
    } else {
      // Just reload feed with new credentials
      await ghLoadFeed();
    }
    render();
  } catch (e) {
    alert('Saved settings, but feed sync failed: ' + e.message);
  }
}

function parseLines(text) {
  return (text || '').split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

function parseWhitelist(text) {
  const validCategories = new Set(MODEL_CATEGORIES);
  const rules = [];
  for (const line of parseLines(text)) {
    const m = line.match(/^(.+?)\s*(?:→|->|=>|\|)\s*(\w+)$/);
    if (!m) continue;
    const pattern = m[1].trim();
    const category = m[2].trim().toLowerCase();
    if (validCategories.has(category) && pattern) {
      rules.push({ pattern, category });
    }
  }
  return rules;
}

function renderActivityEntry(a) {
  let icon = '•', verb = '', extra = '';
  if (a.type === 'add') {
    icon = '+'; verb = 'added';
    if (a.category) extra = `<span class="item-tab-badge tab-${a.category}" style="position:static;box-shadow:none;font-size:9px;padding:2px 6px;margin-left:6px;">${TAB_LABELS[a.category]}</span>`;
  } else if (a.type === 'delete') {
    icon = '−'; verb = 'deleted';
  } else if (a.type === 'categorize') {
    icon = '↷'; 
    if (a.newCategory && a.oldCategory) {
      verb = `re-categorized as`;
      extra = `<span class="item-tab-badge tab-${a.newCategory}" style="position:static;box-shadow:none;font-size:9px;padding:2px 6px;margin-left:6px;">${TAB_LABELS[a.newCategory]}</span> <span style="color:var(--muted);font-size:10px;">(was ${TAB_LABELS[a.oldCategory]})</span>`;
    } else if (a.newCategory) {
      verb = 'categorized as';
      extra = `<span class="item-tab-badge tab-${a.newCategory}" style="position:static;box-shadow:none;font-size:9px;padding:2px 6px;margin-left:6px;">${TAB_LABELS[a.newCategory]}</span>`;
    } else {
      verb = `removed category`;
      extra = a.oldCategory ? `<span style="color:var(--muted);font-size:10px;margin-left:6px;">(was ${TAB_LABELS[a.oldCategory]})</span>` : '';
    }
  }
  const itemStillExists = !!findItem(a.itemId);
  const titleHtml = itemStillExists
    ? `<a href="#" onclick="event.preventDefault(); closeModal(); openItemDetail('${a.itemId}');" class="history-item-link">${escapeHtml(a.itemTitle)}</a>`
    : `<span class="history-item-deleted">${escapeHtml(a.itemTitle)}</span>`;
  return `
    <div class="history-entry">
      <div class="history-icon">${icon}</div>
      <div class="history-text">
        <strong>${escapeHtml(a.by)}</strong> <span style="color:var(--muted)">${verb}</span> ${titleHtml}${extra}
      </div>
      <div class="history-time">${formatTime(a.at)}</div>
    </div>`;
}

function formatDayKey(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const tDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (dDay.getTime() === tDay.getTime()) return 'TODAY';
  if (dDay.getTime() === yesterday.getTime()) return 'YESTERDAY';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
